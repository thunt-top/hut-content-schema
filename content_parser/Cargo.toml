[package]
name = "content_parser"
version = "0.1.0"
edition = "2024"

[dependencies]
comrak = { version = "0.54.0", default-features = false }
content_crypto = { path = "../content_crypto" }
flate2 = "1.1.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sign-bound = "2.2.0"
toml = "1.1.4"
blake3 = "1.8.7"
hex = "0.4.3"
derive-getters = { version = "0.5.0", features = ["auto_copy_getters"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
base64 = "0.22"
